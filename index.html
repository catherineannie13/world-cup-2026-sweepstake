<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>World Cup 2026 Sweepstake — Live Tracker</title>
<style>
  :root{
    --bg:#0a0e27; --bg2:#131a4a; --gold:#ffd24a; --gold2:#ffb800; --green:#14e88a;
    --red:#ff4d6d; --blue:#4d8bff; --card:rgba(255,255,255,0.06); --bd:rgba(255,255,255,0.12);
    --text:#f4f6ff; --muted:#9aa3c7;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--text);
    background:radial-gradient(circle at 15% 0%,rgba(255,210,74,.10),transparent 40%),
      radial-gradient(circle at 85% 100%,rgba(20,232,138,.10),transparent 40%),
      linear-gradient(160deg,var(--bg),var(--bg2));min-height:100vh;}
  .wrap{max-width:1200px;margin:0 auto;padding:20px 18px 80px}
  header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 4px}
  .ttl h1{font-size:clamp(22px,4vw,34px);font-weight:900;letter-spacing:-.5px;
    background:linear-gradient(90deg,#fff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
  .ttl p{color:var(--muted);font-size:13px}
  .status{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);box-shadow:0 0 0 0 rgba(20,232,138,.6)}
  .dot.live{background:var(--green);animation:pulse 1.6s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(20,232,138,.5)}70%{box-shadow:0 0 0 10px rgba(20,232,138,0)}100%{box-shadow:0 0 0 0 rgba(20,232,138,0)}}
  .btn{cursor:pointer;border:none;border-radius:10px;font-weight:700;font-size:13px;padding:9px 14px;
    background:rgba(255,255,255,.08);color:var(--text);border:1px solid var(--bd)}
  .btn:hover{background:rgba(255,255,255,.14)}

  .banner{background:linear-gradient(90deg,rgba(255,210,74,.16),rgba(20,232,138,.12));border:1px solid var(--bd);
    border-radius:14px;padding:14px 18px;margin:14px 0;text-align:center;font-weight:700}
  .banner b{color:var(--gold)}

  section{margin-top:22px}
  h2.sec{font-size:15px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:8px}

  /* Leaderboard */
  .lb{width:100%;border-collapse:separate;border-spacing:0 8px}
  .lb th{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);text-align:center;padding:0 8px;font-weight:700}
  .lb th.l,.lb td.l{text-align:left}
  .lb td{background:var(--card);border-top:1px solid var(--bd);border-bottom:1px solid var(--bd);padding:12px 8px;text-align:center;font-size:14px}
  .lb td:first-child{border-left:1px solid var(--bd);border-radius:12px 0 0 12px}
  .lb td:last-child{border-right:1px solid var(--bd);border-radius:0 12px 12px 0}
  .lb tr.top td{background:linear-gradient(90deg,rgba(255,210,74,.16),var(--card));border-color:rgba(255,210,74,.4)}
  .rank{font-weight:900;font-size:18px;width:46px}
  .rank .medal{font-size:20px}
  .pl-name{font-weight:800;font-size:16px}
  .pts{font-weight:900;font-size:20px;color:var(--gold)}
  .alive-pill{display:inline-block;min-width:26px;padding:2px 8px;border-radius:999px;background:rgba(20,232,138,.16);color:var(--green);font-weight:800}
  .alive-pill.zero{background:rgba(255,77,109,.16);color:var(--red)}
  .muted{color:var(--muted)}

  /* Stat cards */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
  .stat .k{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .stat .v{font-size:20px;font-weight:900;margin-top:6px}
  .stat .s{font-size:12px;color:var(--muted);margin-top:2px}

  /* Player cards */
  .players{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .pcard{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:13px}
  .pcard .ph{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  .pcard .ph .nm{font-weight:800;font-size:15px}
  .pcard .ph .pp{font-weight:900;color:var(--gold);font-size:15px}
  .trow{display:flex;align-items:center;gap:8px;padding:6px 6px;border-radius:8px;font-size:13px}
  .trow:nth-child(odd){background:rgba(0,0,0,.18)}
  .trow .fl{font-size:18px;width:24px;text-align:center}
  .trow .tn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .trow .rec{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .badge{font-size:9px;font-weight:800;padding:2px 6px;border-radius:6px;letter-spacing:.5px;text-transform:uppercase}
  .b-grp{background:rgba(77,139,255,.18);color:#9bc0ff}
  .b-ko{background:rgba(255,210,74,.18);color:var(--gold)}
  .b-out{background:rgba(255,77,109,.16);color:var(--red)}
  .b-champ{background:linear-gradient(90deg,var(--gold),var(--gold2));color:#1a1500}
  .trow.out{opacity:.5}

  /* Fixtures */
  .fxgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .fx{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;margin-bottom:8px;font-size:13px;display:flex;align-items:center;gap:10px}
  .fx .dt{color:var(--muted);font-size:11px;width:74px;flex-shrink:0}
  .fx .mt{flex:1;display:flex;align-items:center;gap:6px;justify-content:center}
  .fx .sc{font-weight:800;font-variant-numeric:tabular-nums}
  .fx .own{font-size:10px;color:var(--gold);font-weight:700}
  .fx .vs{color:var(--muted);font-size:11px}
  .fx.clash{border-color:rgba(255,210,74,.45);background:linear-gradient(90deg,rgba(255,210,74,.10),var(--card))}
  .win{color:var(--green);font-weight:800}
  .empty{color:var(--muted);font-size:13px;padding:8px}

  footer{margin-top:30px;color:var(--muted);font-size:11px;text-align:center;line-height:1.7}
  footer code{background:rgba(0,0,0,.3);padding:1px 5px;border-radius:4px}
  .lb-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .mini{display:none}
  @media(max-width:860px){.players{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.fxgrid{grid-template-columns:1fr}}
  @media(max-width:560px){
    .lb th,.lb td{padding:11px 5px;font-size:13px}
    .lb td:first-child{border-radius:10px 0 0 10px}
    .lb td:last-child{border-radius:0 10px 10px 0}
    .rank{width:30px}
    .pl-name{font-size:14px}
    .full{display:none}
    .mini{display:inline}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="ttl">
      <h1>🏆 World Cup 2026 — Sweepstake Tracker</h1>
      <p>8 players · 6 teams each · 🏆 winner owns the champion</p>
    </div>
    <div class="status">
      <span class="dot" id="dot"></span><span id="updated">Loading…</span>
      <button class="btn" id="refresh">↻ Refresh</button>
    </div>
  </header>

  <div class="banner" id="banner">Loading live data…</div>

  <section>
    <h2 class="sec">🏆 The Race for the Trophy</h2>
    <div class="lb-wrap">
    <table class="lb">
      <thead id="lbHead"></thead>
      <tbody id="lbBody"></tbody>
    </table>
    </div>
  </section>

  <section>
    <h2 class="sec">✨ Talking Points</h2>
    <div class="stats" id="statCards"></div>
  </section>

  <section>
    <h2 class="sec">👥 The Squads</h2>
    <div class="players" id="players"></div>
  </section>

  <section>
    <h2 class="sec">📅 Fixtures &amp; Results</h2>
    <div class="fxgrid">
      <div>
        <div style="font-weight:800;margin-bottom:8px">⏭️ Coming up</div>
        <div id="upcoming"></div>
      </div>
      <div>
        <div style="font-weight:800;margin-bottom:8px">✅ Recent results</div>
        <div id="recent"></div>
      </div>
    </div>
  </section>

  <footer id="foot"></footer>
</div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const API_KEY = "123";               // free key — returns full data. ("3" is a throttled legacy key capped at ~5 events.)
const LEAGUE_ID = 4429;              // FIFA World Cup
const SEASON = "2026";
// The page reads a static data file that a GitHub Action refreshes ~every 30 min.
// This means viewers make ZERO calls to the football API, so the free key never
// gets rate-limited no matter how many family members open the page.
const DATA_URL = "data/wc.json";
const KICKOFF = new Date("2026-06-11T19:00:00");
const REFRESH_MS = 120000;

// Safety net: if the FINAL is decided on penalties, the API stores only the level
// 90/120-min score and can't tell us who won. Set this to the winning team name
// (e.g. "Spain") to crown the champion manually. Leave "" the rest of the time.
const MANUAL_CHAMPION = "";

/* ============================================================
   ROSTERS (as drawn) + flags
   ============================================================ */
const FLAG = {
  "Netherlands":"🇳🇱","United States":"🇺🇸","Canada":"🇨🇦","Scotland":"🏴󠁧󠁢󠁳󠁣󠁴󠁿","Curaçao":"🇨🇼","Sweden":"🇸🇪",
  "Brazil":"🇧🇷","Colombia":"🇨🇴","Australia":"🇦🇺","Norway":"🇳🇴","Qatar":"🇶🇦","Haiti":"🇭🇹",
  "Argentina":"🇦🇷","Germany":"🇩🇪","Japan":"🇯🇵","Egypt":"🇪🇬","Jordan":"🇯🇴","Bosnia & Herzegovina":"🇧🇦",
  "France":"🇫🇷","Mexico":"🇲🇽","Ecuador":"🇪🇨","Paraguay":"🇵🇾","Ghana":"🇬🇭","New Zealand":"🇳🇿",
  "Belgium":"🇧🇪","Switzerland":"🇨🇭","Iran":"🇮🇷","Tunisia":"🇹🇳","Cape Verde":"🇨🇻","Turkey":"🇹🇷",
  "England":"🏴󠁧󠁢󠁥󠁮󠁧󠁿","Morocco":"🇲🇦","Austria":"🇦🇹","Ivory Coast":"🇨🇮","Saudi Arabia":"🇸🇦","DR Congo":"🇨🇩",
  "Portugal":"🇵🇹","Uruguay":"🇺🇾","Senegal":"🇸🇳","Panama":"🇵🇦","South Africa":"🇿🇦","Czechia":"🇨🇿",
  "Spain":"🇪🇸","Croatia":"🇭🇷","South Korea":"🇰🇷","Algeria":"🇩🇿","Uzbekistan":"🇺🇿","Iraq":"🇮🇶"
};
const ROSTERS = {
  "Catherine":["Netherlands","United States","Canada","Scotland","Curaçao","Sweden"],
  "Vlad":["Brazil","Colombia","Australia","Norway","Qatar","Haiti"],
  "Emma":["Argentina","Germany","Japan","Egypt","Jordan","Bosnia & Herzegovina"],
  "George":["France","Mexico","Ecuador","Paraguay","Ghana","New Zealand"],
  "Grandma":["Belgium","Switzerland","Iran","Tunisia","Cape Verde","Turkey"],
  "Carol":["England","Morocco","Austria","Ivory Coast","Saudi Arabia","DR Congo"],
  "Cheryl":["Portugal","Uruguay","Senegal","Panama","South Africa","Czechia"],
  "Tony":["Spain","Croatia","South Korea","Algeria","Uzbekistan","Iraq"]
};

/* Official group draw (5 Dec 2025): canonical team -> group letter */
const GROUPS = {
  "Mexico":"A","South Africa":"A","South Korea":"A","Czechia":"A",
  "Canada":"B","Bosnia & Herzegovina":"B","Qatar":"B","Switzerland":"B",
  "Brazil":"C","Morocco":"C","Haiti":"C","Scotland":"C",
  "United States":"D","Paraguay":"D","Australia":"D","Turkey":"D",
  "Germany":"E","Curaçao":"E","Ivory Coast":"E","Ecuador":"E",
  "Netherlands":"F","Japan":"F","Sweden":"F","Tunisia":"F",
  "Belgium":"G","Egypt":"G","Iran":"G","New Zealand":"G",
  "Spain":"H","Cape Verde":"H","Saudi Arabia":"H","Uruguay":"H",
  "France":"I","Senegal":"I","Iraq":"I","Norway":"I",
  "Argentina":"J","Algeria":"J","Austria":"J","Jordan":"J",
  "Portugal":"K","DR Congo":"K","Uzbekistan":"K","Colombia":"K",
  "England":"L","Croatia":"L","Ghana":"L","Panama":"L"
};

/* Map an API team name to our canonical roster name */
const norm = s => (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]/g,"");
const CANON = {};
Object.keys(FLAG).forEach(c => CANON[norm(c)] = c);
[ // aliases: api spelling -> canonical
  ["usa","United States"],["unitedstatesofamerica","United States"],
  ["czechrepublic","Czechia"],
  ["bosnia","Bosnia & Herzegovina"],["bosniaandherzegovina","Bosnia & Herzegovina"],["bosniaherzegovina","Bosnia & Herzegovina"],
  ["congodr","DR Congo"],["democraticrepublicofcongo","DR Congo"],["congodemocraticrepublic","DR Congo"],["drcongo","DR Congo"],
  ["cotedivoire","Ivory Coast"],
  ["turkiye","Turkey"],
  ["korearepublic","South Korea"],["republicofkorea","South Korea"],
  ["caboverde","Cape Verde"]
].forEach(([k,v]) => CANON[k] = v);
const resolve = name => CANON[norm(name)] || null;

const OWNER = {}; // canonical team -> player
Object.entries(ROSTERS).forEach(([p,ts]) => ts.forEach(t => OWNER[t] = p));

/* ============================================================
   FETCH + PROCESS
   ============================================================ */
// We MERGE every response into a map keyed by event id, so a throttled/partial
// response (the API sometimes returns only a few rows) can never wipe matches we've
// already seen — fixtures persist and scores just update in place. Knockout matches
// are added automatically as they appear in the feed.
let eventMap = {}, lastAt = 0;
try { const c=JSON.parse(localStorage.getItem("wc26cache")||"null"); if(c&&c.map){ eventMap=c.map; lastAt=c.at||0; } } catch(e){}

async function load(){
  setStatus(false, "Updating…");
  try{
    const res = await fetch(DATA_URL + "?_=" + Date.now(), {cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const data = await res.json();
    const events = (data && data.events) || [];
    if(!events.length) throw new Error("no events");
    events.forEach(e=>{ if(e && e.idEvent) eventMap[e.idEvent]=e; });
    lastAt = data.updated ? Date.parse(data.updated) : Date.now();
    try{ localStorage.setItem("wc26cache", JSON.stringify({map:eventMap, at:lastAt})); }catch(e){}
    render(Object.values(eventMap));
    setStatus(true, "Updated "+timeAgo(lastAt));
  }catch(err){
    const cached = Object.values(eventMap);
    if(cached.length){
      render(cached);
      setStatus(false, "Offline — showing cached ("+timeAgo(lastAt)+")");
    }else{
      document.getElementById('banner').innerHTML =
        "⚠️ Couldn't reach the football API and no cached data yet.<br>"+
        "<span class='muted'>Check your internet, or the tournament data may not be live yet. It auto-retries.</span>";
      setStatus(false, "No data");
    }
  }
}

function isFinished(ev){ return ev.intHomeScore!==null && ev.intHomeScore!=="" && ev.intAwayScore!==null && ev.intAwayScore!==""; }

function process(events){
  // base team stats
  const T = {};
  Object.keys(OWNER).forEach(t => T[t] = {team:t,owner:OWNER[t],P:0,W:0,D:0,L:0,GF:0,GA:0,pts:0,koBonus:0,
    alive:true,eliminated:false,champion:false,stage:"Group",lastResult:null});

  // KO detection. TheSportsDB codes KO rounds by teams remaining (R32=32, R16=16, QF=8, SF=4),
  // but the Final/3rd reuse codes 2/1, which collide with group matchdays 1/2. Round 3 is only
  // ever a group matchday, so its last date marks the end of the group stage; any code-1/2 match
  // happening after that is the Final/3rd place, not a group game.
  const ri=ev=>+ev.intRound, dt=ev=>+new Date(ev.strTimestamp||ev.dateEvent);
  let groupEnd=0; events.forEach(ev=>{ if(ri(ev)===3){ const t=dt(ev); if(t>groupEnd) groupEnd=t; } });
  const isKO=ev=>{ const r=ri(ev); if(r>3) return true; if((r===1||r===2)&&groupEnd>0&&dt(ev)>groupEnd) return true; return false; };

  // KO rounds are coded by TEAMS REMAINING (R32=32, R16=16, QF=8, SF=4, Final=2). We name by
  // code, not match count — a half-published round (e.g. only 1 of 8 R16 ties listed) would be
  // mis-counted otherwise.
  const KO_NAME={32:"Round of 32",16:"Round of 16",8:"Quarter-final",4:"Semi-final",2:"Final",1:"Final"};
  const STAGE_RANK={"Group":1,"Round of 32":2,"Round of 16":3,"Quarter-final":4,"Semi-final":5,"Final":6,"Champion":7};
  const RANK_NAME={1:"Group",2:"Round of 32",3:"Round of 16",4:"Quarter-final",5:"Semi-final",6:"Final",7:"Champion"};
  const RANK_BONUS={1:0,2:0,3:4,4:10,5:19,6:32,7:52}; // cumulative advancement bonus by furthest round reached
  const koRank = ev => isKO(ev) ? (STAGE_RANK[KO_NAME[ri(ev)]]||2) : 1;

  const teamsInKO = new Set();
  events.forEach(ev=>{ if(isKO(ev)){ [resolve(ev.strHomeTeam),resolve(ev.strAwayTeam)].forEach(t=>t&&teamsInKO.add(t)); } });

  // 1) furthest round each team APPEARS in (scheduled or played)
  Object.values(T).forEach(s=>{ s.reachedRank = teamsInKO.has(s.team) ? 2 : 1; });
  events.forEach(ev=>{
    const rank=koRank(ev);
    [resolve(ev.strHomeTeam),resolve(ev.strAwayTeam)].forEach(t=>{ if(t&&T[t]&&rank>T[t].reachedRank) T[t].reachedRank=rank; });
  });

  // 2) walk finished games: stats (W/D/L, goals, pts) + DECISIVE knockout advancement/elimination
  const pens=[]; // KO ties level after normal time → decided on penalties (winner not in the score)
  events.slice().sort((a,b)=>dt(a)-dt(b)).forEach(ev=>{
    if(!isFinished(ev)) return;
    const h=resolve(ev.strHomeTeam), a=resolve(ev.strAwayTeam);
    const hs=+ev.intHomeScore, as=+ev.intAwayScore;
    const ko=isKO(ev), rank=koRank(ev);
    [[h,hs,as,a],[a,as,hs,h]].forEach(([t,gf,ga,opp])=>{
      if(!t||!T[t]) return;
      const s=T[t]; s.P++; s.GF+=gf; s.GA+=ga;
      if(gf>ga){ s.W++; s.pts+=3; } else if(gf===ga){ s.D++; s.pts+=1; } else { s.L++; }
      s.lastResult={gf,ga,opp,round:ko?(KO_NAME[ri(ev)]||"Knockout"):("Group · MD"+ri(ev)),date:ev.dateEvent,won:gf>ga,draw:gf===ga};
    });
    if(ko && h && a && T[h] && T[a]){
      if(hs>as){ T[h].reachedRank=Math.max(T[h].reachedRank,rank+1); T[a].eliminated=true; }
      else if(as>hs){ T[a].reachedRank=Math.max(T[a].reachedRank,rank+1); T[h].eliminated=true; }
      else pens.push({h,a,rank}); // resolve from who turns up in a later round
    }
  });

  // 3) resolve penalty shootouts via the bracket: whoever appears in a later round won
  pens.forEach(({h,a,rank})=>{
    const hAdv=T[h].reachedRank>rank, aAdv=T[a].reachedRank>rank;
    if(hAdv && !aAdv) T[a].eliminated=true;
    else if(aAdv && !hAdv) T[h].eliminated=true;
    // neither in a later round yet → next round not published → leave both alive (pending)
  });

  // 4) champion = winner of the actual Final (latest match at the deepest round); pens → MANUAL_CHAMPION
  let finalEv=null;
  events.forEach(ev=>{ if(koRank(ev)>=6 && (!finalEv || dt(ev)>dt(finalEv))) finalEv=ev; });
  if(finalEv && isFinished(finalEv)){
    const hs=+finalEv.intHomeScore, as=+finalEv.intAwayScore;
    const w = hs>as ? resolve(finalEv.strHomeTeam) : (as>hs ? resolve(finalEv.strAwayTeam) : null);
    if(w && T[w]) T[w].champion=true;
  }
  if(MANUAL_CHAMPION && T[MANUAL_CHAMPION]){ Object.values(T).forEach(s=>{s.champion=false}); T[MANUAL_CHAMPION].champion=true; }

  // 5) finalise status, stage label, advancement bonus
  Object.values(T).forEach(s=>{
    if(s.champion){ s.eliminated=false; s.reachedRank=7; }
    else if(teamsInKO.size>0 && !teamsInKO.has(s.team)){ s.eliminated=true; } // didn't reach the bracket
    s.alive = !s.eliminated;
    s.stageRank = Math.min(s.reachedRank, 7);
    s.stage = RANK_NAME[s.stageRank] || "Group";
    s.koBonus = RANK_BONUS[s.stageRank] || 0;
  });

  // players — sorted by who's CLOSEST to owning the champion
  const players = Object.keys(ROSTERS).map(name=>{
    const teams = ROSTERS[name].map(t=>T[t]);
    const agg = teams.reduce((o,s)=>{o.pts+=s.pts+s.koBonus;o.P+=s.P;o.W+=s.W;o.D+=s.D;o.L+=s.L;o.GF+=s.GF;o.GA+=s.GA;o.alive+=s.alive?1:0;return o;},
      {pts:0,P:0,W:0,D:0,L:0,GF:0,GA:0,alive:0});
    agg.name=name; agg.teams=teams; agg.GD=agg.GF-agg.GA;
    agg.hasChampion = teams.some(s=>s.champion);
    const aliveTeams = teams.filter(s=>s.alive);
    agg.best = (aliveTeams.length?aliveTeams:teams).slice().sort((x,y)=>y.stageRank-x.stageRank)[0];
    agg.bestAliveRank = aliveTeams.reduce((m,s)=>Math.max(m,s.stageRank),0);
    agg.bestReachedRank = teams.reduce((m,s)=>Math.max(m,s.stageRank),0);
    return agg;
  }).sort((a,b)=>
    (b.hasChampion-a.hasChampion) || (b.bestAliveRank-a.bestAliveRank) ||
    (b.alive-a.alive) || (b.bestReachedRank-a.bestReachedRank) ||
    (b.pts-a.pts) || (b.GF-a.GF));

  return {T,players,events,anyFinished:events.some(isFinished),knockoutsStarted:teamsInKO.size>0};
}

/* ============================================================
   RENDER
   ============================================================ */
function render(events){
  const M = process(events);
  renderBanner(M);
  renderLeaderboard(M);
  renderStats(M);
  renderPlayers(M);
  renderFixtures(M);
  document.getElementById('foot').innerHTML =
    `🏆 <b>Winner = whoever owns the team that wins the World Cup.</b> Points &amp; stats are just for bragging rights.<br>`+
    `Data: TheSportsDB (refreshed ~every 30 min) · league <code>${LEAGUE_ID}</code> season <code>${SEASON}</code> · points: 3/win, 1/draw + KO bonus.`;
}

function renderBanner(M){
  const b=document.getElementById('banner');
  const now=new Date();
  const champ=Object.values(M.T).find(s=>s.champion);
  if(champ){ b.innerHTML = `🏆 <b>${champ.team} are World Champions!</b> ${FLAG[champ.team]} — congratulations <b>${champ.owner}</b>, you've won the sweepstake! 🎉`; return; }
  if(!M.anyFinished && now<KICKOFF){
    const days=Math.ceil((KICKOFF-now)/86400000);
    b.innerHTML = `⚽ Kicks off in <b>${days} day${days!==1?'s':''}</b> (Mexico v South Africa, 11 Jun). 🏆 <b>The winner is whoever owns the team that lifts the trophy</b> — the points &amp; stats below are just for bragging rights!`;
    return;
  }
  const inHunt=M.players.filter(p=>p.alive>0);
  const deepest=[...M.players].sort((a,b)=>b.bestAliveRank-a.bestAliveRank)[0];
  const lead=(M.knockoutsStarted&&deepest&&deepest.best&&deepest.best.alive)?`${FLAG[deepest.best.team]} ${deepest.best.team} (${deepest.name})`:'';
  b.innerHTML = `🏆 Winner owns the champion · <b>${inHunt.length}</b> of 8 still in the hunt`+(lead?` · furthest team: <b>${lead}</b>`:'');
}

// competition ranking: tied players (same sort key) share a rank → 1,1,1,4,…
function rankKey(p){ return [p.hasChampion?1:0,p.bestAliveRank,p.alive,p.bestReachedRank,p.pts,p.GF].join('|'); }
function computeRanks(players){
  return players.map((p,i)=> (i>0 && rankKey(p)===rankKey(players[i-1])) ? null : i+1)
    .reduce((acc,r,i)=>{ acc[i]= r===null?acc[i-1]:r; return acc; },[]);
}
const SHORT={"Group":"Group","Round of 32":"R32","Round of 16":"R16","Quarter-final":"QF","Semi-final":"SF","3rd Place":"3rd","Final":"Final","Champion":"Champion"};
function statusCell(p){
  if(p.hasChampion) return '<span class="badge b-champ"><span class="full">🏆 Won</span><span class="mini">🏆</span></span>';
  if(p.alive===0)   return '<span class="badge b-out"><span class="full">Out</span><span class="mini">❌</span></span>';
  return '<span class="badge b-grp"><span class="full">In the hunt</span><span class="mini">🟢</span></span>';
}
function bestRunCell(p){
  const s=p.best; if(!s) return '<span class="muted">—</span>';
  if(s.champion) return `${FLAG[s.team]} ${s.team} <span class="muted" style="font-size:11px">· 🏆 Champion</span>`;
  const lbl = s.stage==="Group" ? "Group "+(GROUPS[s.team]||'?') : (SHORT[s.stage]||s.stage);
  const dim = s.alive?'':' style="opacity:.55"';
  return `<span${dim}>${FLAG[s.team]} ${s.team} <span class="muted" style="font-size:11px">· ${lbl}</span></span>`;
}
function renderLeaderboard(M){
  const ranks=computeRanks(M.players);
  const count={}; ranks.forEach(r=>count[r]=(count[r]||0)+1);
  const rankCell=i=>{
    const r=ranks[i];
    if(count[r]===1 && r<=3) return `<span class="medal">${r===1?'🥇':r===2?'🥈':'🥉'}</span>`;
    return `<span class="medal" style="font-size:17px">${r}</span>`;
  };
  const ko=M.knockoutsStarted; // only show "Furthest team" once the knockouts begin
  document.getElementById('lbHead').innerHTML = `<tr>
    <th>#</th><th class="l">Player</th><th>Status</th>
    ${ko?'<th class="l">Furthest team</th>':''}
    <th>Alive</th><th class="hide">Pts</th><th class="hide">Goals</th>
  </tr>`;
  document.getElementById('lbBody').innerHTML = M.players.map((p,i)=>`
    <tr class="${ranks[i]===1 && count[1]===1 ? 'top':''}">
      <td class="rank">${rankCell(i)}</td>
      <td class="l pl-name">${p.name}</td>
      <td>${statusCell(p)}</td>
      ${ko?`<td class="l">${bestRunCell(p)}</td>`:''}
      <td><span class="alive-pill ${p.alive===0?'zero':''}">${p.alive}/6</span></td>
      <td class="hide"><span class="pts" style="font-size:15px">${p.pts}</span></td>
      <td class="hide">${p.GF}<span class="muted" style="font-size:11px">:${p.GA}</span></td>
    </tr>`).join('');
}

function renderStats(M){
  const teams=Object.values(M.T);
  const cards=[];
  // most goals scored — only name a leader once someone's actually scored
  const maxGF=Math.max(...M.players.map(p=>p.GF));
  if(maxGF===0){ cards.push(['⚽ Most goals scored', '—', 'no goals yet']); }
  else { const ld=M.players.filter(p=>p.GF===maxGF);
    cards.push(['⚽ Most goals scored', ld.length>1?`${ld.length}-way tie`:ld[0].name, `${maxGF} goal${maxGF!==1?'s':''}${ld.length>1?' each':''}`]); }
  // most teams alive — show a leader only when someone has fewer than the rest
  const maxAlive=Math.max(...M.players.map(p=>p.alive)), minAlive=Math.min(...M.players.map(p=>p.alive));
  if(maxAlive===minAlive){ cards.push(['💪 Teams still alive', `Everyone · ${maxAlive}/6`, 'nobody knocked out yet']); }
  else { const ld=M.players.filter(p=>p.alive===maxAlive);
    cards.push(['💪 Most teams alive', ld.length>1?`${ld.length} players · ${maxAlive}/6`:ld[0].name, `${maxAlive} of 6 still in it`]); }
  // star nation — only once a team has earned something
  const tScore=s=>s.pts+s.koBonus, maxTS=Math.max(...teams.map(tScore));
  if(maxTS===0){ cards.push(['⭐ Star nation', '—', 'crowned once games begin']); }
  else { const starT=[...teams].sort((a,b)=>tScore(b)-tScore(a)||b.GF-a.GF)[0];
    cards.push(['⭐ Star nation', `${FLAG[starT.team]} ${starT.team}`, `${tScore(starT)} pts · owned by ${starT.owner}`]); }
  // biggest win (roster team involved)
  let big=null;
  M.events.filter(isFinished).forEach(ev=>{
    const h=resolve(ev.strHomeTeam),a=resolve(ev.strAwayTeam); if(!h&&!a) return;
    const m=Math.abs(+ev.intHomeScore-+ev.intAwayScore);
    if(!big||m>big.m) big={m,ev,h,a};
  });
  if(big){ const e=big.ev;
    cards.push(['💥 Biggest win', `${e.strHomeTeam} ${e.intHomeScore}–${e.intAwayScore} ${e.strAwayTeam}`, `margin of ${big.m}`]);
  } else cards.push(['💥 Biggest win', '—', 'no matches played yet']);
  // trophy watch — players still in contention
  const inHunt=M.players.filter(p=>p.alive>0);
  if(inHunt.length===1){ cards.push(['🏆 One win away', `${inHunt[0].name}`, `the only player still in it!`]); }
  else cards.push(['🏆 Still in the hunt', `${inHunt.length} / 8`, `players with a team still alive`]);
  // next all-roster clash
  const clash=upcomingList(M).find(f=>f.h&&f.a);
  if(clash){ cards.push(['⚔️ Rival clash incoming', `${clash.ev.strHomeTeam} vs ${clash.ev.strAwayTeam}`, `${OWNER[clash.h]} vs ${OWNER[clash.a]} · ${fmtDate(clash.ev)}`]); }
  else cards.push(['🤝 Bottom watch', `${M.players[M.players.length-1].name}`, `${M.players[M.players.length-1].pts} pts — needs a hero`]);

  document.getElementById('statCards').innerHTML = cards.map(c=>`
    <div class="stat"><div class="k">${c[0]}</div><div class="v">${c[1]}</div><div class="s">${c[2]}</div></div>`).join('');
}

function teamBadge(s){
  if(s.champion) return '<span class="badge b-champ">🏆 Champion</span>';
  if(s.eliminated) return '<span class="badge b-out">Out</span>';
  if(s.stage && s.stage!=="Group") return `<span class="badge b-ko">${s.stage.replace('Round of','R')}</span>`;
  return `<span class="badge b-grp">Group ${GROUPS[s.team]||'?'}</span>`;
}
function renderPlayers(M){
  document.getElementById('players').innerHTML = M.players.map(p=>`
    <div class="pcard">
      <div class="ph"><span class="nm">${p.name}</span><span class="pp">${p.pts} pts</span></div>
      ${p.teams.map(s=>`
        <div class="trow ${s.eliminated?'out':''}">
          <span class="fl">${FLAG[s.team]}</span>
          <span class="tn">${s.team}</span>
          <span class="rec">${s.P?`${s.W}-${s.D}-${s.L}`:'–'}</span>
          ${teamBadge(s)}
        </div>`).join('')}
    </div>`).join('');
}

// strTimestamp from the API is UTC but has no timezone marker, so we append 'Z'
// and render everything in UK time (BST/GMT) so it's correct for the whole family.
const UK={timeZone:'Europe/London'};
function fmtDate(ev){
  let ts=ev.strTimestamp;
  if(ts && !/[zZ]|[+-]\d\d:?\d\d$/.test(ts)) ts+='Z';
  const d=new Date(ts || ev.dateEvent);
  return d.toLocaleDateString('en-GB',{...UK,month:'short',day:'numeric'})+' '+d.toLocaleTimeString('en-GB',{...UK,hour:'2-digit',minute:'2-digit'});
}
function rosterFixture(ev){
  const h=resolve(ev.strHomeTeam),a=resolve(ev.strAwayTeam);
  if(!h&&!a) return null; return {ev,h,a};
}
function upcomingList(M){
  return M.events.filter(e=>!isFinished(e)).map(rosterFixture).filter(Boolean)
    .sort((x,y)=>new Date(x.ev.strTimestamp||x.ev.dateEvent)-new Date(y.ev.strTimestamp||y.ev.dateEvent));
}
function renderFixtures(M){
  const up=upcomingList(M).slice(0,8);
  const upEl=document.getElementById('upcoming');
  upEl.innerHTML = up.length? up.map(f=>fxRow(f,false)).join('') : '<div class="empty">No upcoming fixtures involving anyone\'s teams.</div>';

  const recent=M.events.filter(isFinished).map(rosterFixture).filter(Boolean)
    .sort((x,y)=>new Date(y.ev.strTimestamp||y.ev.dateEvent)-new Date(x.ev.strTimestamp||x.ev.dateEvent)).slice(0,8);
  const recEl=document.getElementById('recent');
  recEl.innerHTML = recent.length? recent.map(f=>fxRow(f,true)).join('') : '<div class="empty">No results yet — check back after 11 June.</div>';
}
function fxRow(f,done){
  const {ev,h,a}=f; const clash=h&&a;
  const own=t=> t?`<span class="own">${OWNER[t]}</span>`:'';
  const nm=(side,canon)=> `${own(canon)} ${FLAG[canon]||''} ${ev[side]}`.trim();
  let mid;
  if(done){
    const hs=+ev.intHomeScore, as=+ev.intAwayScore;
    const hw=hs>as, aw=as>hs;
    mid=`<span class="mt"><span class="${hw?'win':''}">${nm('strHomeTeam',h)}</span> <span class="sc">${hs}–${as}</span> <span class="${aw?'win':''}">${nm('strAwayTeam',a)}</span></span>`;
  }else{
    mid=`<span class="mt">${nm('strHomeTeam',h)} <span class="vs">v</span> ${nm('strAwayTeam',a)}</span>`;
  }
  return `<div class="fx ${clash?'clash':''}"><span class="dt">${fmtDate(ev)}</span>${mid}</div>`;
}

/* ============================================================
   STATUS / TIMERS
   ============================================================ */
function setStatus(live,txt){ document.getElementById('dot').className='dot'+(live?' live':''); document.getElementById('updated').textContent=txt; }
function timeAgo(ts){ const s=Math.round((Date.now()-ts)/1000); if(s<60)return 'just now'; const m=Math.round(s/60); if(m<60)return m+'m ago'; return Math.round(m/60)+'h ago'; }
document.getElementById('refresh').addEventListener('click', load);
load();
setInterval(load, REFRESH_MS);
</script>
